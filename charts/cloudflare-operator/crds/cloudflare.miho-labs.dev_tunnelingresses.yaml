  names:
    kind: TunnelIngress
    listKind: TunnelIngressList
    plural: tunnelingresses
    shortNames:
    - cfingress
    singular: tunnelingress
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tunnelRef.name
      name: Tunnel
      type: string
