                      - default
                      - eu
                      - fedramp
                      type: string
                    name:
                      description: Name of a bucket that exists on Cloudflare (not
                        necessarily managed by the operator).
                      pattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
                      type: string
                    ref:
