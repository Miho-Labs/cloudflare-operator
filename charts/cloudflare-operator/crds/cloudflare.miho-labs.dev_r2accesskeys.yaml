                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoint:
                description: Endpoint is the S3-compatible endpoint for the account.
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  reflects.
                format: int64
                type: integer
              secretName:
                description: SecretName holding the credentials.
                type: string
              tokenID:
                description: TokenID of the API token (also the S3 access key ID).
                type: string
            type: object
        type: object
