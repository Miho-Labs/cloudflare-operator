metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: dnsrecords.cloudflare.miho-labs.dev
spec:
  group: cloudflare.miho-labs.dev
  names:
    kind: DNSRecord
    listKind: DNSRecordList
    plural: dnsrecords
    shortNames:
    - cfdns
    singular: dnsrecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.content
      name: Content
      type: string
    - jsonPath: .spec.proxied
      name: Proxied
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: DNSRecord manages one DNS record in a Cloudflare zone.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DNSRecordSpec defines a DNS record in a zone.
            properties:
              accountRef:
                description: AccountRef selects the CloudflareAccount whose token
                  is used.
                properties:
                  name:
                    description: Name of the CloudflareAccount resource.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              comment:
                description: Comment shown in the dashboard.
                type: string
              content:
                description: Content of the record (IP, hostname, text...).
                minLength: 1
                type: string
              deletionPolicy:
                default: Delete
                description: DeletionPolicy controls whether the record is removed
                  from Cloudflare on delete.
                enum:
                - Delete
                - Retain
                type: string
              name:
                description: Name of the record, e.g. "app.example.com" or "@" for
                  the zone apex.
                minLength: 1
                type: string
              priority:
                description: Priority for MX and SRV records.
                type: integer
              proxied:
                description: Proxied routes traffic through Cloudflare (only A, AAAA
                  and CNAME).
                type: boolean
              tags:
                description: Tags attached to the record (requires a plan that supports
                  record tags).
                items:
                  type: string
                type: array
              ttl:
                default: 1
                description: TTL in seconds. 1 means "automatic". Proxied records
                  always use automatic TTL.
                minimum: 1
                type: integer
              type:
                description: Type of the record.
                enum:
                - A
                - AAAA
                - CNAME
                - TXT
                - MX
                - NS
                - SRV
                - CAA
                - PTR
                type: string
              zone:
                description: Zone the record lives in.
                properties:
                  id:
                    description: ID of the zone (32 hex characters).
                    type: string
                  name:
                    description: Name of the zone, e.g. "example.com".
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of zone.name or zone.id must be set
                  rule: has(self.name) != has(self.id)
            required:
            - accountRef
            - content
            - name
            - type
            - zone
            type: object
          status:
            description: DNSRecordStatus is the observed state of a DNSRecord.
            properties:
              conditions:
                description: Conditions describe the current state of the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fqdn:
                description: FQDN as reported by Cloudflare.
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  reflects.
                format: int64
                type: integer
              recordID:
                description: RecordID on Cloudflare.
                type: string
              zoneID:
                description: ZoneID the record was created in.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
