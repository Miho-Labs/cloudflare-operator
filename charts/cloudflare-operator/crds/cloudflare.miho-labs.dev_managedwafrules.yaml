                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              managedRulesetID:
                description: ManagedRulesetID of the deployed Cloudflare ruleset.
                type: string
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  reflects.
                format: int64
                type: integer
              ruleID:
                description: RuleID inside the ruleset.
                type: string
              ruleVersion:
                description: RuleVersion last observed.
                type: string
              rulesetID:
                description: RulesetID of the zone's phase entrypoint ruleset.
                type: string
              zoneID:
                description: ZoneID the rule lives in.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
