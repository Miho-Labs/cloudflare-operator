                      properties:
                        action:
                          description: Action override.
                          enum:
                          - block
                          - challenge
                          - managed_challenge
                          - js_challenge
                          - log
                          type: string
                        enabled:
                          description: Enabled override.
                          type: boolean
                        id:
                          description: ID of the managed rule.
                          minLength: 1
                          type: string
                        scoreThreshold:
