            type: string
          metadata:
            type: object
          spec:
            description: |-
              ManagedWAFRuleSpec deploys a Cloudflare managed ruleset in the zone's
              http_request_firewall_managed ruleset.
            properties:
              accountRef:
                description: AccountRef selects the CloudflareAccount whose token
                  is used.
                properties:
                  name:
                    description: Name of the CloudflareAccount resource.
