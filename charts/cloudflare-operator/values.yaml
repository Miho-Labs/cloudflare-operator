# Default values for cloudflare-operator.

replicaCount: 1

image:
  repository: ghcr.io/miho-labs/cloudflare-operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Operator behaviour.
operator:
  # How often every resource is compared against Cloudflare and drift corrected.
  resyncPeriod: 10m
  # Default cloudflared image used by Tunnel connectors (Tunnel.spec.cloudflared.image overrides it).
  cloudflaredImage: cloudflare/cloudflared:2025.10.0
  # Comma-separated list of namespaces to watch. Empty watches the whole cluster.
  watchNamespaces: ""
  # Leader election keeps a single active replica.
  leaderElection: true
  # Log level: info or debug.
  logLevel: info
  # Extra arguments appended to the manager command line.
  extraArgs: []
  # Extra environment variables for the manager container.
  extraEnv: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

metrics:
  enabled: true
  port: 8080
  service:
    type: ClusterIP
    annotations: {}
  # Create a Prometheus Operator ServiceMonitor.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
topologySpreadConstraints: []
