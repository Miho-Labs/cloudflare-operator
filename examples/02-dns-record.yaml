# A DNS record on its own, without any tunnel.
apiVersion: cloudflare.miho-labs.dev/v1alpha1
kind: DNSRecord
metadata:
  name: www
  namespace: default
spec:
  accountRef:
    name: main
  zone:
    name: example.com
  type: A
  name: www.example.com
  content: 203.0.113.10
  proxied: true
  comment: "managed by cloudflare-operator"
---
apiVersion: cloudflare.miho-labs.dev/v1alpha1
kind: DNSRecord
metadata:
  name: mail
  namespace: default
spec:
  accountRef:
    name: main
  zone:
    name: example.com
  type: MX
  name: example.com
  content: mail.example.com
  priority: 10
  ttl: 3600
  deletionPolicy: Retain
